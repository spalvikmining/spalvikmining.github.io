    <form class="search" id="searchForm" role="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" placeholder="Search for mining courses" aria-label="Search courses">
    </form>
    <button class="menu-btn" id="menuBtn" aria-label="Open menu"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    <nav class="navlinks" id="navlinks">
      <a class="nl" href="courses.html">Courses</a>
      <a class="nl hide-md" href="advisory.html">Advisory</a>

      <a class="nl mob-only" href="about.html">About</a>
      <a class="nl mob-only" href="contact.html">Contact</a>

</header>
<main class="auth-page">
  <div class="auth-art" style="background-image:url('photo-haul-truck.jpg')"><div class="quote"><b>Start learning mining properly.</b><span>Free account. Practical courses. Real industry skills.</span></div></div>
  <div class="auth-form"><div class="inner">
    <h1>Create your account</h1>
    <p class="lead">Join mining students and professionals learning on Spalvik.</p>
    <button class="btn btn-google" id="googleBtn" type="button"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg> Continue with Google</button>
    <div class="or">or</div>
    <form id="form">
      <label for="name">Full name</label><input id="name" required autocomplete="name">
      <label for="email">Email</label><input id="email" type="email" required autocomplete="email">
      <label for="password">Password (at least 6 characters)</label><input id="password" type="password" required minlength="6" autocomplete="new-password">
      <button class="btn btn-copper" id="submitBtn" type="submit">Create account</button>
    </form>
    <div class="msg" id="msg" aria-live="polite"></div>
    <div class="foot">Already have an account? <a href="login.html">Log in</a></div>
  </div></div>
</main>

<script type="module" src="site.js"></script>
<script type="module">
import { auth, db, friendlyError } from "./firebase.js";
import { createUserWithEmailAndPassword, updateProfile, sendEmailVerification, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import { doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
async function ensureProfile(user, name) {
  const ref = doc(db, "users", user.uid);
  if (!(await getDoc(ref)).exists()) {
    await setDoc(ref, { name: name || user.displayName || "", email: user.email, role: "user", createdAt: serverTimestamp() });
  }
}
const msg = document.getElementById("msg");
const show = (t, ok=false) => { msg.textContent = t; msg.className = "msg " + (ok ? "ok" : "err"); };
document.getElementById("googleBtn").addEventListener("click", async () => {
  try { const { user } = await signInWithPopup(auth, new GoogleAuthProvider()); await ensureProfile(user); location.href = "dashboard.html"; }
  catch (err) { show(friendlyError(err)); }
});
document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault(); const b = document.getElementById("submitBtn"); b.disabled = true; show("Creating your account…", true);
  const nm = document.getElementById("name").value.trim();
  try {
    const { user } = await createUserWithEmailAndPassword(auth, email.value.trim(), password.value);
    await updateProfile(user, { displayName: nm }); await ensureProfile(user, nm);
    sendEmailVerification(user).catch(() => {});
    location.href = "dashboard.html";
  } catch (err) { show(friendlyError(err)); b.disabled = false; }
});
</script>
</body>
</html>
