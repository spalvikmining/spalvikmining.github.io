<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My account · Spalvik Mining</title>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
<style>
  .info{margin-top:18px;border:1px solid var(--line);border-radius:12px}
  .info div{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--line);font-size:.93rem}
  .info div:first-child{border-top:0}
  .info span{color:var(--stone)}
  .badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:700;background:var(--sand)}
  .badge.admin{background:var(--copper);color:#fff}
  .note{background:#fff7ec;border:1px solid #f0d9bd;border-radius:10px;padding:12px 14px;font-size:.88rem;margin-top:16px}
</style>
</head>
<body>
<div class="top"><a class="brand" href="index.html"><img src="logo-mark.png" alt="Spalvik Mining logo"><span><b>SPALVIK</b><i>MINING</i></span></a></div>
<main>
  <div class="box" id="box">
    <p class="sub">Loading your account…</p>
  </div>
</main>

<script type="module">
import { auth, db, friendlyError } from "./firebase.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const box = document.getElementById("box");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

// Not logged in? Send them to the login page.
onAuthStateChanged(auth, async (user) => {
  if (!user) { location.href = "login.html"; return; }
  let profile = {};
  try { const snap = await getDoc(doc(db, "users", user.uid)); profile = snap.data() || {}; }
  catch (err) { profile = { error: friendlyError(err) }; }
  const role = profile.role || "user";
  box.innerHTML = `
    <h1>Hi, ${esc(profile.name || user.displayName || "there")} 👋</h1>
    <p class="sub">This is your Spalvik Mining account. Your full dashboard is coming next.</p>
    <div class="info">
      <div><span>Email</span><b>${esc(user.email)}</b></div>
      <div><span>Email verified</span><b>${user.emailVerified ? "Yes ✅" : "Not yet — check your inbox"}</b></div>
      <div><span>Account type</span><b><span class="badge ${role === "admin" ? "admin" : ""}">${esc(role)}</span></b></div>
    </div>
    ${profile.error ? `<div class="note">${esc(profile.error)}</div>` : ""}
    ${role === "admin" ? `<a class="btn btn-primary" href="admin.html">Open admin panel →</a>` : ""}
    <button class="btn btn-dark" id="logout">Log out</button>
    <p class="foot"><a href="index.html">← Back to website</a></p>`;
  document.getElementById("logout").onclick = async () => { await signOut(auth); location.href = "index.html"; };
});
</script>
</body>
</html>
