<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · Spalvik Mining</title>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
<style>
  body{display:block}
  .top{justify-content:space-between;position:sticky;top:0;z-index:10}
  .top .right{display:flex;align-items:center;gap:14px;font-size:.9rem}
  .pill{background:var(--copper);color:#fff;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:999px;letter-spacing:.06em}
  .small-btn{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}
  .small-btn:hover{border-color:var(--copper);color:var(--copper)}
  .small-btn.danger:hover{border-color:var(--red);color:var(--red)}
  .small-btn.primary{background:var(--copper);border-color:var(--copper);color:#fff}
  .layout{max-width:1120px;margin:0 auto;padding:28px 20px 60px}
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:18px 0 24px;overflow-x:auto}
  .tab{background:none;border:0;padding:12px 16px;font:inherit;font-weight:600;color:var(--stone);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
  .tab.active{color:var(--ink);border-color:var(--copper)}
  .panel{display:none}.panel.active{display:block}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px}
  .stat span{color:var(--stone);font-size:.85rem}
  .stat b{display:block;font-family:"Space Grotesk";font-size:2.2rem;margin-top:4px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:20px}
  .card h2{font-size:1.15rem;margin-bottom:4px}
  .muted{color:var(--stone);font-size:.88rem}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  @media(max-width:700px){.grid2{grid-template-columns:1fr}}
  select,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fbfaf8}
  textarea{min-height:90px;resize:vertical}
  .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .actions .btn{width:auto;margin-top:0;padding:11px 22px}
  table{width:100%;border-collapse:collapse;font-size:.9rem}
  th{text-align:left;color:var(--stone);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;padding:10px 12px;border-bottom:1px solid var(--line)}
  td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
  .table-wrap{overflow-x:auto}
  .badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.75rem;font-weight:700;background:var(--sand)}
  .badge.admin,.badge.published{background:var(--copper);color:#fff}
  .badge.tutor,.badge.approved{background:#1e7a46;color:#fff}
  .badge.pending{background:#f3e6da;color:var(--copper)}
  .badge.rejected{background:#f3dcdc;color:var(--red)}
  .app{border-top:1px solid var(--line);padding:18px 0}
  .app:first-child{border-top:0}
  .app dl{display:grid;grid-template-columns:160px 1fr;gap:6px 14px;font-size:.9rem;margin:12px 0}
  .app dt{color:var(--stone)}
  @media(max-width:600px){.app dl{grid-template-columns:1fr}}
  .badge.draft{background:#e9e6e1;color:var(--stone)}
  .search{max-width:320px;margin-bottom:14px}
  .item{border-top:1px solid var(--line);padding:14px 0;display:flex;justify-content:space-between;gap:14px}
  .item:first-of-type{border-top:0}
  .item p{color:var(--stone);font-size:.9rem;white-space:pre-wrap}
  .empty{color:var(--stone);padding:16px 0;font-size:.92rem}
  .lesson{display:flex;gap:14px;align-items:flex-start;border-top:1px solid var(--line);padding:14px 0}
  .lesson:first-child{border-top:0}
  .lnum{flex:none;width:32px;height:32px;border-radius:50%;background:var(--sand);display:grid;place-items:center;font-weight:700;font-size:.85rem}
  .lbody{flex:1;min-width:0}
  .lbody p{color:var(--stone);font-size:.88rem;word-break:break-word}
  .lbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .type{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:#f3e6da;color:var(--copper);margin-left:6px;text-transform:uppercase;letter-spacing:.04em}
  .video{position:relative;padding-top:56.25%;border-radius:10px;overflow:hidden;background:#000;margin-top:14px}
  .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .back{margin-bottom:16px}
  .cover-box{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:4px}
  .cover-prev{width:200px;aspect-ratio:16/9;border-radius:10px;background:var(--sand) center/cover no-repeat;border:1px dashed var(--line);display:grid;place-items:center;color:var(--stone);font-size:.8rem}
  .thumb{width:72px;aspect-ratio:16/9;border-radius:6px;background:var(--sand) center/cover no-repeat;flex:none}
  .ctitle{display:flex;gap:12px;align-items:center}
  .hint{color:var(--stone);font-size:.8rem;margin-top:4px}
  .module{border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
  .mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#faf7f3;padding:12px 16px;flex-wrap:wrap}
  .mhead b{font-family:"Space Grotesk"}
  .module .lessons-in{padding:0 16px}
  .inline{display:flex;gap:10px;flex-wrap:wrap}
  .inline input{flex:1;min-width:200px}
  .inline .btn{width:auto;margin-top:0;padding:11px 20px}
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none}
  #toast.show{opacity:1}
</style>
</head>
<body>
<div class="top">
  <a class="brand" href="index.html"><img src="logo-mark.png" alt="Spalvik Mining logo"><span><b>SPALVIK</b><i>MINING</i></span></a>
  <div class="right"><span class="pill">ADMIN</span><a class="small-btn" href="dashboard.html">My account</a><button class="small-btn" id="logout">Log out</button></div>
</div>

<div class="layout" id="app"><p class="muted">Checking admin access…</p></div>

<template id="tpl">
  <h1 style="font-size:1.8rem">Admin panel</h1>
  <p class="muted">Manage members, courses and announcements for Spalvik Mining.</p>
  <div class="tabs">
    <button class="tab active" data-tab="overview">Overview</button>
    <button class="tab" data-tab="users">Users</button>
    <button class="tab" data-tab="courses">Courses</button>
    <button class="tab" data-tab="news">Announcements</button>
    <button class="tab" data-tab="tutors">Tutor applications <span class="badge" id="tCount" hidden></span></button>
  </div>

  <!-- OVERVIEW -->
  <section class="panel active" id="overview">
    <div class="stats">
      <div class="stat"><span>Registered users</span><b id="sUsers">–</b></div>
      <div class="stat"><span>Admins</span><b id="sAdmins">–</b></div>
      <div class="stat"><span>Published courses</span><b id="sCourses">–</b></div>
      <div class="stat"><span>Announcements</span><b id="sNews">–</b></div>
    </div>
  </section>

  <!-- USERS -->
  <section class="panel" id="users">
    <div class="card">
      <h2>All users</h2>
      <p class="muted" style="margin-bottom:14px">Everyone who has created an account.</p>
      <input class="search" id="userSearch" placeholder="Search by name or email…">
      <div class="table-wrap"><table>
        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th><th></th></tr></thead>
        <tbody id="userRows"></tbody>
      </table></div>
    </div>
  </section>

  <!-- COURSES -->
  <section class="panel" id="courses">
    <div class="card">
      <h2 id="courseFormTitle">Add a course</h2>
      <p class="muted">Draft courses are hidden from the public; published ones will show on the website.</p>
      <form id="courseForm">
        <label>Course title</label><input id="cTitle" required>
        <div class="grid2">
          <div><label>Category</label>
            <select id="cCategory"><option>Short course</option><option>Software training</option><option>Workshop</option><option>Webinar</option></select></div>
          <div><label>Mode</label>
            <select id="cMode"><option>Online</option><option>In person</option><option>Hybrid</option></select></div>
          <div><label>Start date</label><input id="cDate" type="date"></div>
          <div><label>Price (GHS) — 0 for free</label><input id="cPrice" type="number" min="0" step="0.01" value="0"></div>
          <div><label>Duration</label><input id="cDuration"></div>
          <div><label>Status</label>
            <select id="cStatus"><option value="draft">Draft (hidden)</option><option value="published">Published (visible)</option></select></div>
        </div>
        <div class="grid2">
          <div><label>Instructor</label><input id="cInstructor"></div>
          <div><label>Level</label>
            <select id="cLevel"><option>Beginner</option><option>Intermediate</option><option>Advanced</option><option>All levels</option></select></div>
        </div>
        <label>Short summary (one line shown on course cards)</label><input id="cSummary" maxlength="160">
        <label>Full description</label><textarea id="cDesc"></textarea>
        <div class="grid2">
          <div><label>What you'll learn</label><textarea id="cLearn" placeholder="One point per line"></textarea></div>
          <div><label>Requirements</label><textarea id="cReq" placeholder="One per line"></textarea></div>
        </div>
        <label>Cover image</label>
        <div class="cover-box">
          <div class="cover-prev" id="cCoverPrev">No image</div>
          <div>
            <input type="file" id="cCoverFile" accept="image/*">
            <p class="hint">JPG or PNG. It's resized automatically (ideal: landscape, 16:9).</p>
            <button type="button" class="small-btn danger" id="cCoverRemove" hidden>Remove image</button>
          </div>
        </div>
        <div class="actions">
          <button class="btn btn-primary" type="submit" id="cSave">Save course</button>
          <button class="btn btn-google" type="button" id="cCancel" hidden>Cancel editing</button>
        </div>
      </form>
    </div>
    <div class="card">
      <h2>All courses</h2>
      <div class="table-wrap"><table>
        <thead><tr><th>Course</th><th>Category</th><th>Start</th><th>Price</th><th>Status</th><th></th></tr></thead>
        <tbody id="courseRows"></tbody>
      </table></div>
    </div>
  </section>

  <!-- ANNOUNCEMENTS -->
  <section class="panel" id="news">
    <div class="card">
      <h2>Post an announcement</h2>
      <p class="muted">Logged-in members will see these on their dashboard.</p>
      <form id="newsForm">
        <label>Title</label><input id="nTitle" required>
        <label>Message</label><textarea id="nBody" required></textarea>
        <div class="actions"><button class="btn btn-primary" type="submit">Post announcement</button></div>
      </form>
    </div>
    <div class="card"><h2>Posted announcements</h2><div id="newsList"></div></div>
  </section>

  <!-- TUTOR APPLICATIONS -->
  <section class="panel" id="tutors">
    <div class="card">
      <h2>Tutor applications</h2>
      <p class="muted" style="margin-bottom:10px">People who applied through "Teach on Spalvik". Approving sets their account type to <b>tutor</b>.</p>
      <div id="tutorList"></div>
    </div>
  </section>

  <!-- COURSE CONTENT (opened from a course's "Content" button) -->
  <section class="panel" id="lessons">
    <button class="small-btn back" id="backToCourses">← Back to courses</button>
    <h2 style="font-size:1.4rem" id="lcTitle">Course content</h2>
    <p class="muted" style="margin-bottom:18px">Add the lessons for this course in the order students should follow them.</p>
    <div class="card">
      <h2>Modules</h2>
      <p class="muted" style="margin-bottom:12px">Group lessons into sections, e.g. "Module 1 — Fundamentals".</p>
      <form id="moduleForm" class="inline">
        <input id="mTitle" required placeholder="New module title">
        <button class="btn btn-primary" type="submit">Add module</button>
      </form>
    </div>
    <div class="card">
      <h2 id="lessonFormTitle">Add a lesson</h2>
      <form id="lessonForm">
        <label>Module</label><select id="lModule"></select>
        <label>Lesson title</label><input id="lTitle" required>
        <div class="grid2">
          <div><label>Lesson type</label>
            <select id="lType">
              <option value="video">Video (YouTube link)</option>
              <option value="document">Document / slides (link)</option>
              <option value="text">Text notes only</option>
            </select></div>
          <div><label>Duration (optional)</label><input id="lDuration"></div>
        </div>
        <div id="lUrlWrap">
          <label id="lUrlLabel">YouTube video link</label>
          <input id="lUrl">
          <p class="muted" id="lUrlHelp" style="margin-top:6px">Upload the video to YouTube as <b>Unlisted</b>, then paste its link here.</p>
          <div id="lPreview"></div>
        </div>
        <label>Notes / description (optional)</label><textarea id="lNotes"></textarea>
        <div class="actions">
          <button class="btn btn-primary" type="submit" id="lSave">Add lesson</button>
          <button class="btn btn-google" type="button" id="lCancel" hidden>Cancel editing</button>
        </div>
      </form>
    </div>
    <div class="card"><h2>Course outline <span class="muted" id="lCount"></span></h2><div id="lessonList"></div></div>
  </section>
</template>

<div id="toast"></div>

<script type="module">
import { auth, db, friendlyError } from "./firebase.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import { doc, getDoc, getDocs, collection, addDoc, updateDoc, deleteDoc, serverTimestamp, query, orderBy, writeBatch }
  from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const fmtDate = ts => ts?.toDate ? ts.toDate().toLocaleDateString("en-GB", { day:"numeric", month:"short", year:"numeric" }) : "–";
function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("show"); setTimeout(()=>el.classList.remove("show"),2500); }

let me = null, users = [], courses = [], news = [], editingCourse = null;
let currentCourse = null, lessons = [], editingLesson = null, modules = [], coverData = "";

$("logout").onclick = async () => { await signOut(auth); location.href = "index.html"; };

// ---- Gate: only admins get in ----
onAuthStateChanged(auth, async (user) => {
  if (!user) { location.href = "login.html"; return; }
  const snap = await getDoc(doc(db, "users", user.uid)).catch(() => null);
  if (!snap || snap.data()?.role !== "admin") { location.href = "dashboard.html"; return; }
  me = user;
  $("app").innerHTML = ""; $("app").appendChild($("tpl").content.cloneNode(true));
  wireUp();
  await Promise.all([loadUsers(), loadCourses(), loadNews(), loadTutors()]);
});

function wireUp() {
  document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x === t));
    document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === t.dataset.tab));
  });
  $("userSearch").oninput = renderUsers;
  $("courseForm").onsubmit = saveCourse;
  $("cCancel").onclick = resetCourseForm;
  $("cCoverFile").onchange = handleCover;
  $("cCoverRemove").onclick = () => setCover("");
  $("moduleForm").onsubmit = addModule;
  $("newsForm").onsubmit = postNews;
  $("backToCourses").onclick = () => showPanel("courses");
  $("lessonForm").onsubmit = saveLesson;
  $("lCancel").onclick = resetLessonForm;
  $("lType").onchange = updateLessonType;
  $("lUrl").oninput = updatePreview;
}
function showPanel(id) {
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === id));
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === (id === "lessons" ? "courses" : id)));
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function updateStats() {
  $("sUsers").textContent = users.length;
  $("sAdmins").textContent = users.filter(u => u.role === "admin").length;
  $("sCourses").textContent = courses.filter(c => c.status === "published").length;
  $("sNews").textContent = news.length;
}

// ---- USERS ----
async function loadUsers() {
  try {
    const snap = await getDocs(collection(db, "users"));
    users = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
  } catch (e) { toast(friendlyError(e)); }
  renderUsers(); updateStats();
}
function renderUsers() {
  const q = ($("userSearch").value || "").toLowerCase();
  const list = users.filter(u => (u.name + " " + u.email).toLowerCase().includes(q));
  $("userRows").innerHTML = list.length ? list.map(u => `
    <tr>
      <td><b>${esc(u.name || "—")}</b></td>
      <td>${esc(u.email)}</td>
      <td><span class="badge ${esc(u.role)}">${esc(u.role)}</span></td>
      <td>${fmtDate(u.createdAt)}</td>
      <td style="text-align:right">${u.id === me.uid ? '<span class="muted">You</span>' :
        `<button class="small-btn" data-role="${u.id}">${u.role === "admin" ? "Remove admin" : "Make admin"}</button>`}</td>
    </tr>`).join("") : `<tr><td colspan="5" class="empty">No users found.</td></tr>`;
  document.querySelectorAll("[data-role]").forEach(b => b.onclick = () => toggleRole(b.dataset.role));
}
async function toggleRole(uid) {
  const u = users.find(x => x.id === uid);
  const newRole = u.role === "admin" ? (apps.some(a => a.id === uid && a.status === "approved") ? "tutor" : "user") : "admin";
  if (!confirm(`Change ${u.name || u.email} to "${newRole}"?`)) return;
  try { await updateDoc(doc(db, "users", uid), { role: newRole }); u.role = newRole; renderUsers(); updateStats(); toast("Role updated."); }
  catch (e) { toast(friendlyError(e)); }
}

// ---- COURSES ----
async function loadCourses() {
  try {
    const snap = await getDocs(query(collection(db, "courses"), orderBy("createdAt", "desc")));
    courses = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch (e) { toast(friendlyError(e)); }
  renderCourses(); updateStats();
}
function renderCourses() {
  $("courseRows").innerHTML = courses.length ? courses.map(c => `
    <tr>
      <td><div class="ctitle"><div class="thumb" style="${c.cover ? `background-image:url('${c.cover}')` : ""}"></div>
        <div><b>${esc(c.title)}</b><br><span class="muted">${esc(c.mode)}${c.level ? " · " + esc(c.level) : ""}${c.duration ? " · " + esc(c.duration) : ""}</span></div></div></td>
      <td>${esc(c.category)}</td>
      <td>${c.startDate ? esc(new Date(c.startDate).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})) : "TBA"}</td>
      <td>${Number(c.price) ? "GHS " + Number(c.price).toFixed(2) : "Free"}</td>
      <td><span class="badge ${esc(c.status)}">${esc(c.status)}</span></td>
      <td style="text-align:right;white-space:nowrap">
        <button class="small-btn primary" data-content="${c.id}">Content</button>
        <button class="small-btn" data-edit="${c.id}">Edit</button>
        <button class="small-btn danger" data-del="${c.id}">Delete</button></td>
    </tr>`).join("") : `<tr><td colspan="6" class="empty">No courses yet. Add your first one above.</td></tr>`;
  document.querySelectorAll("[data-content]").forEach(b => b.onclick = () => openContent(b.dataset.content));
  document.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => editCourse(b.dataset.edit));
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => deleteCourse(b.dataset.del));
}
function editCourse(id) {
  const c = courses.find(x => x.id === id); editingCourse = id;
  $("cTitle").value = c.title || ""; $("cCategory").value = c.category; $("cMode").value = c.mode;
  $("cDate").value = c.startDate || ""; $("cPrice").value = c.price ?? 0; $("cDuration").value = c.duration || "";
  $("cStatus").value = c.status; $("cDesc").value = c.description || "";
  $("cInstructor").value = c.instructor || ""; $("cLevel").value = c.level || "Beginner"; $("cSummary").value = c.summary || "";
  $("cLearn").value = (c.learn || []).join("\n"); $("cReq").value = (c.requirements || []).join("\n"); setCover(c.cover || "");
  $("courseFormTitle").textContent = "Edit course"; $("cSave").textContent = "Save changes"; $("cCancel").hidden = false;
  $("courseForm").scrollIntoView({ behavior: "smooth" });
}
function resetCourseForm() {
  editingCourse = null; $("courseForm").reset(); setCover("");
  $("courseFormTitle").textContent = "Add a course"; $("cSave").textContent = "Save course"; $("cCancel").hidden = true;
}
async function saveCourse(e) {
  e.preventDefault();
  const data = {
    title: $("cTitle").value.trim(), category: $("cCategory").value, mode: $("cMode").value,
    startDate: $("cDate").value, price: Number($("cPrice").value) || 0, duration: $("cDuration").value.trim(),
    status: $("cStatus").value, description: $("cDesc").value.trim(),
    instructor: $("cInstructor").value.trim(), level: $("cLevel").value, summary: $("cSummary").value.trim(),
    learn: lines($("cLearn").value), requirements: lines($("cReq").value), cover: coverData,
    updatedAt: serverTimestamp()
  };
  try {
    if (editingCourse) { await updateDoc(doc(db, "courses", editingCourse), data); toast("Course updated."); }
    else { await addDoc(collection(db, "courses"), { ...data, createdAt: serverTimestamp() }); toast("Course added."); }
    resetCourseForm(); loadCourses();
  } catch (err) { toast(friendlyError(err)); }
}
async function deleteCourse(id) {
  const c = courses.find(x => x.id === id);
  if (!confirm(`Delete "${c.title}"? Delete its lessons first in "Content". This can't be undone.`)) return;
  try { await deleteDoc(doc(db, "courses", id)); toast("Course deleted."); loadCourses(); }
  catch (e) { toast(friendlyError(e)); }
}

// ---- course detail helpers ----
const lines = t => t.split("\n").map(x => x.trim()).filter(Boolean);
function setCover(data) {
  coverData = data;
  const p = $("cCoverPrev");
  p.style.backgroundImage = data ? `url('${data}')` : ""; p.textContent = data ? "" : "No image";
  $("cCoverRemove").hidden = !data; if (!data) $("cCoverFile").value = "";
}
// Shrinks the picture to max 960px wide JPEG so it can be stored with the course (no paid storage needed)
function handleCover(e) {
  const file = e.target.files[0]; if (!file) return;
  const img = new Image();
  img.onload = () => {
    const scale = Math.min(1, 960 / img.width);
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    let q = 0.8, data = c.toDataURL("image/jpeg", q);
    while (data.length > 250000 && q > 0.3) { q -= 0.1; data = c.toDataURL("image/jpeg", q); }
    setCover(data); URL.revokeObjectURL(img.src);
  };
  img.onerror = () => toast("Couldn't read that image.");
  img.src = URL.createObjectURL(file);
}

// ---- COURSE CONTENT (lessons live in courses/{courseId}/lessons) ----
function youtubeId(url) {
  const m = String(url).match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
function videoEmbed(id) {
  return `<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${id}" allowfullscreen
    allow="accelerometer; encrypted-media; gyroscope; picture-in-picture"></iframe></div>`;
}
function updateLessonType() {
  const t = $("lType").value;
  $("lUrlWrap").hidden = t === "text";
  $("lUrlLabel").textContent = t === "video" ? "YouTube video link" : "Document link";
  $("lUrlHelp").innerHTML = t === "video"
    ? "Upload the video to YouTube as <b>Unlisted</b>, then paste its link here."
    : "Upload the PDF/slides to Google Drive, set sharing to <b>Anyone with the link</b>, then paste the link here.";
  updatePreview();
}
function updatePreview() {
  const id = $("lType").value === "video" ? youtubeId($("lUrl").value) : null;
  $("lPreview").innerHTML = id ? videoEmbed(id) : "";
}
async function openContent(courseId) {
  currentCourse = courses.find(c => c.id === courseId);
  $("lcTitle").textContent = "Content: " + currentCourse.title;
  showPanel("lessons"); await loadLessons(); resetLessonForm();
}
async function loadLessons() {
  try {
    const [ms, ls] = await Promise.all([
      getDocs(query(collection(db, "courses", currentCourse.id, "modules"), orderBy("order"))),
      getDocs(query(collection(db, "courses", currentCourse.id, "lessons"), orderBy("order")))]);
    modules = ms.docs.map(d => ({ id: d.id, ...d.data() }));
    lessons = ls.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch (e) { toast(friendlyError(e)); lessons = []; modules = []; }
  const keep = $("lModule").value;
  $("lModule").innerHTML = (modules.length ? "" : `<option value="">— No modules yet —</option>`) +
    modules.map(m => `<option value="${m.id}">${esc(m.title)}</option>`).join("") +
    (modules.length ? `<option value="">(No module)</option>` : "");
  if ([...$("lModule").options].some(o => o.value === keep)) $("lModule").value = keep;
  renderLessons();
}
function lessonsIn(mid) { return lessons.filter(l => (l.moduleId || "") === mid); }
function lessonHTML(l, n, group) {
  const idx = group.indexOf(l);
  return `
    <div class="lesson">
      <div class="lnum">${n}</div>
      <div class="lbody">
        <b>${esc(l.title)}</b><span class="type">${esc(l.type)}</span>
        ${l.duration ? `<span class="muted"> · ${esc(l.duration)}</span>` : ""}
        ${l.type === "document" && l.url ? `<p><a class="link" href="${esc(l.url)}" target="_blank" rel="noopener">Open document ↗</a></p>` : ""}
        ${l.type === "video" && !youtubeId(l.url) ? `<p style="color:var(--red)">Video link not recognised</p>` : ""}
        ${l.notes ? `<p>${esc(l.notes)}</p>` : ""}
      </div>
      <div class="lbtns">
        <button class="small-btn" data-lmove="${l.id}|-1" ${idx === 0 ? "disabled" : ""} title="Move up">↑</button>
        <button class="small-btn" data-lmove="${l.id}|1" ${idx === group.length - 1 ? "disabled" : ""} title="Move down">↓</button>
        <button class="small-btn" data-ledit="${l.id}">Edit</button>
        <button class="small-btn danger" data-ldel="${l.id}">Delete</button>
      </div>
    </div>`;
}
function renderLessons() {
  $("lCount").textContent = `(${modules.length} modules · ${lessons.length} lessons)`;
  let n = 0, html = "";
  modules.forEach((m, mi) => {
    const group = lessonsIn(m.id);
    html += `<div class="module"><div class="mhead">
        <b>${esc(m.title)}</b>
        <div class="lbtns">
          <button class="small-btn" data-mmove="${mi}|-1" ${mi === 0 ? "disabled" : ""}>↑</button>
          <button class="small-btn" data-mmove="${mi}|1" ${mi === modules.length - 1 ? "disabled" : ""}>↓</button>
          <button class="small-btn" data-mren="${m.id}">Rename</button>
          <button class="small-btn danger" data-mdel="${m.id}">Delete</button>
        </div></div>
      <div class="lessons-in">${group.length ? group.map(l => lessonHTML(l, ++n, group)).join("") : `<p class="empty">No lessons in this module yet.</p>`}</div></div>`;
  });
  const loose = lessonsIn("");
  if (loose.length) html += `<div class="module"><div class="mhead"><b>${modules.length ? "Not in a module" : "Lessons"}</b></div>
      <div class="lessons-in">${loose.map(l => lessonHTML(l, ++n, loose)).join("")}</div></div>`;
  $("lessonList").innerHTML = html || `<p class="empty">Nothing here yet. Add a module, then your first lesson.</p>`;
  document.querySelectorAll("[data-lmove]").forEach(b => b.onclick = () => { const [id, d] = b.dataset.lmove.split("|"); moveLesson(id, +d); });
  document.querySelectorAll("[data-ledit]").forEach(b => b.onclick = () => editLesson(b.dataset.ledit));
  document.querySelectorAll("[data-ldel]").forEach(b => b.onclick = () => deleteLesson(b.dataset.ldel));
  document.querySelectorAll("[data-mmove]").forEach(b => b.onclick = () => { const [i, d] = b.dataset.mmove.split("|"); moveModule(+i, +d); });
  document.querySelectorAll("[data-mren]").forEach(b => b.onclick = () => renameModule(b.dataset.mren));
  document.querySelectorAll("[data-mdel]").forEach(b => b.onclick = () => deleteModule(b.dataset.mdel));
}
// ---- modules ----
const modRef = () => collection(db, "courses", currentCourse.id, "modules");
async function addModule(e) {
  e.preventDefault();
  const order = modules.length ? Math.max(...modules.map(m => m.order || 0)) + 1 : 1;
  try { const r = await addDoc(modRef(), { title: $("mTitle").value.trim(), order, createdAt: serverTimestamp() });
        $("moduleForm").reset(); toast("Module added."); await loadLessons(); $("lModule").value = r.id; }
  catch (err) { toast(friendlyError(err)); }
}
async function renameModule(id) {
  const m = modules.find(x => x.id === id);
  const t = prompt("New module title:", m.title); if (!t || !t.trim()) return;
  try { await updateDoc(doc(modRef(), id), { title: t.trim() }); loadLessons(); } catch (e) { toast(friendlyError(e)); }
}
async function moveModule(i, d) {
  const a = modules[i], b = modules[i + d]; if (!a || !b) return;
  const batch = writeBatch(db);
  batch.update(doc(modRef(), a.id), { order: b.order }); batch.update(doc(modRef(), b.id), { order: a.order });
  try { await batch.commit(); loadLessons(); } catch (e) { toast(friendlyError(e)); }
}
async function deleteModule(id) {
  if (lessonsIn(id).length) return toast("Move or delete this module's lessons first.");
  if (!confirm("Delete this module?")) return;
  try { await deleteDoc(doc(modRef(), id)); toast("Module deleted."); loadLessons(); } catch (e) { toast(friendlyError(e)); }
}
function resetLessonForm() {
  const keep = $("lModule").value; editingLesson = null; $("lessonForm").reset(); $("lModule").value = keep; updateLessonType();
  $("lessonFormTitle").textContent = "Add a lesson"; $("lSave").textContent = "Add lesson"; $("lCancel").hidden = true;
}
function editLesson(id) {
  const l = lessons.find(x => x.id === id); editingLesson = id;
  $("lTitle").value = l.title || ""; $("lType").value = l.type || "video"; $("lDuration").value = l.duration || "";
  $("lUrl").value = l.url || ""; $("lNotes").value = l.notes || ""; $("lModule").value = l.moduleId || ""; updateLessonType();
  $("lessonFormTitle").textContent = "Edit lesson"; $("lSave").textContent = "Save changes"; $("lCancel").hidden = false;
  $("lessonForm").scrollIntoView({ behavior: "smooth" });
}
async function saveLesson(e) {
  e.preventDefault();
  const type = $("lType").value, url = $("lUrl").value.trim();
  if (type === "video" && !youtubeId(url)) return toast("Please paste a valid YouTube link.");
  if (type === "document" && !/^https?:\/\//.test(url)) return toast("Please paste a valid document link.");
  const data = { title: $("lTitle").value.trim(), type, url: type === "text" ? "" : url,
                 duration: $("lDuration").value.trim(), notes: $("lNotes").value.trim(),
                 moduleId: $("lModule").value || "", updatedAt: serverTimestamp() };
  const ref = collection(db, "courses", currentCourse.id, "lessons");
  try {
    if (editingLesson) { await updateDoc(doc(ref, editingLesson), data); toast("Lesson updated."); }
    else {
      const order = lessons.length ? Math.max(...lessons.map(l => l.order || 0)) + 1 : 1;
      await addDoc(ref, { ...data, order, createdAt: serverTimestamp() }); toast("Lesson added.");
    }
    resetLessonForm(); loadLessons();
  } catch (err) { toast(friendlyError(err)); }
}
async function moveLesson(id, dir) {
  const l = lessons.find(x => x.id === id), group = lessonsIn(l.moduleId || "");
  const a = l, b = group[group.indexOf(l) + dir]; if (!b) return;
  const ref = collection(db, "courses", currentCourse.id, "lessons");
  const batch = writeBatch(db);
  batch.update(doc(ref, a.id), { order: b.order }); batch.update(doc(ref, b.id), { order: a.order });
  try { await batch.commit(); loadLessons(); } catch (e) { toast(friendlyError(e)); }
}
async function deleteLesson(id) {
  const l = lessons.find(x => x.id === id);
  if (!confirm(`Delete lesson "${l.title}"?`)) return;
  try { await deleteDoc(doc(db, "courses", currentCourse.id, "lessons", id)); toast("Lesson deleted."); loadLessons(); }
  catch (e) { toast(friendlyError(e)); }
}

// ---- TUTOR APPLICATIONS ----
let apps = [];
async function loadTutors() {
  try {
    const snap = await getDocs(collection(db, "tutorApplications"));
    apps = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (a.status === "pending" ? -1 : 1) - (b.status === "pending" ? -1 : 1) || (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
  } catch (e) { toast(friendlyError(e)); }
  const pending = apps.filter(a => a.status === "pending").length;
  $("tCount").hidden = !pending; $("tCount").textContent = pending;
  $("tutorList").innerHTML = apps.length ? apps.map(a => `
    <div class="app">
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
        <div><b style="font-size:1.05rem">${esc(a.name)}</b> <span class="badge ${esc(a.status)}">${esc(a.status)}</span><br>
          <span class="muted">${esc(a.role)}${a.org ? " · " + esc(a.org) : ""} · applied ${fmtDate(a.createdAt)}</span></div>
        <div class="lbtns">${a.status !== "approved" ? `<button class="small-btn primary" data-approve="${a.id}">Approve</button>` : ""}
          ${a.status === "pending" ? `<button class="small-btn danger" data-reject="${a.id}">Reject</button>` : ""}</div>
      </div>
      <dl>
        <dt>Email</dt><dd>${esc(a.email)}</dd>
        <dt>Phone / WhatsApp</dt><dd>${esc(a.phone)}</dd>
        <dt>Experience</dt><dd>${esc(a.years)} years</dd>
        <dt>Expertise</dt><dd>${esc(a.expertise)}</dd>
        <dt>Proposed course</dt><dd>${esc(a.topic)}</dd>
        ${a.link ? `<dt>LinkedIn / portfolio</dt><dd><a class="link" href="${esc(a.link)}" target="_blank" rel="noopener">${esc(a.link)}</a></dd>` : ""}
        <dt>Bio</dt><dd style="white-space:pre-wrap">${esc(a.bio)}</dd>
      </dl>
    </div>`).join("") : `<p class="empty">No applications yet.</p>`;
  document.querySelectorAll("[data-approve]").forEach(b => b.onclick = () => decideTutor(b.dataset.approve, "approved"));
  document.querySelectorAll("[data-reject]").forEach(b => b.onclick = () => decideTutor(b.dataset.reject, "rejected"));
}
async function decideTutor(uid, status) {
  const a = apps.find(x => x.id === uid);
  if (!confirm(`${status === "approved" ? "Approve" : "Reject"} ${a.name} as a tutor?`)) return;
  try {
    const batch = writeBatch(db);
    batch.update(doc(db, "tutorApplications", uid), { status, decidedAt: serverTimestamp() });
    const u = users.find(x => x.id === uid);
    if (status === "approved" && u && u.role !== "admin") batch.update(doc(db, "users", uid), { role: "tutor" });
    await batch.commit();
    toast(status === "approved" ? "Tutor approved." : "Application rejected.");
    await Promise.all([loadTutors(), loadUsers()]);
  } catch (e) { toast(friendlyError(e)); }
}

// ---- ANNOUNCEMENTS ----
async function loadNews() {
  try {
    const snap = await getDocs(query(collection(db, "announcements"), orderBy("createdAt", "desc")));
    news = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch (e) { toast(friendlyError(e)); }
  $("newsList").innerHTML = news.length ? news.map(n => `
    <div class="item"><div><b>${esc(n.title)}</b> <span class="muted">· ${fmtDate(n.createdAt)}</span><p>${esc(n.body)}</p></div>
    <div><button class="small-btn danger" data-ndel="${n.id}">Delete</button></div></div>`).join("")
    : `<p class="empty">No announcements yet.</p>`;
  document.querySelectorAll("[data-ndel]").forEach(b => b.onclick = async () => {
    if (!confirm("Delete this announcement?")) return;
    try { await deleteDoc(doc(db, "announcements", b.dataset.ndel)); toast("Announcement deleted."); loadNews(); }
    catch (e) { toast(friendlyError(e)); }
  });
  updateStats();
}
async function postNews(e) {
  e.preventDefault();
  try {
    await addDoc(collection(db, "announcements"), {
      title: $("nTitle").value.trim(), body: $("nBody").value.trim(),
      author: me.displayName || me.email, createdAt: serverTimestamp()
    });
    $("newsForm").reset(); toast("Announcement posted."); loadNews();
  } catch (err) { toast(friendlyError(err)); }
}
